name: Mapping Correction
description: Report an incorrect mapping for an anime
title: '[MAPPING] '
labels: ['mapping-correction']
body:
  - type: input
    id: anilist_id
    attributes:
      label: AniList ID
      description: What is the AniList ID of the anime?
      placeholder: e.g., 101922
    validations:
      required: true
  - type: input
    id: mal_id
    attributes:
      label: Correct MyAnimeList (MAL) ID
      description: Provide the correct MAL ID if applicable.
  - type: input
    id: tmdb_id
    attributes:
      label: Correct The Movie Database (TMDB) ID
      description: Provide the correct TMDB ID if applicable.
  - type: input
    id: tvdb_id
    attributes:
      label: Correct TheTVDB (TVDB) ID
      description: Provide the correct TVDB ID if applicable.
  - type: textarea
    id: context
    attributes:
      label: Additional Context
      description: Add any other context about this anime (e.g., "The TVDB ID should be for the movie version, not the show").
