name: Bug Report
description: Create a report to help us improve the automation pipeline or manual checker UI
title: '[BUG] '
labels: ['bug']
body:
  - type: textarea
    id: description
    attributes:
      label: Describe the bug
      description: A clear and concise description of what the bug is.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: To Reproduce
      description: Steps to reproduce the behavior.
      placeholder: |
        1. Go to '...'
        2. Click on '....'
        3. Run command '....'
        4. See error
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: A clear and concise description of what you expected to happen.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Screenshots/Logs
      description: If applicable, add screenshots or terminal output to help explain your problem.
  - type: input
    id: os
    attributes:
      label: Operating System
      placeholder: e.g., Windows, Ubuntu, macOS
  - type: input
    id: python_version
    attributes:
      label: Python version
      placeholder: e.g., 3.10
